spring.application.name=usuarios-service

server.port=${SERVER_PORT:8082}

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pagoflex_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

roles.service.url=${ROLES_SERVICE_URL:http://localhost:8081}

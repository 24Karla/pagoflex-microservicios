spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=roles-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://roles-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/roles,/api/roles/**
spring.cloud.gateway.server.webflux.routes[1].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/usuarios,/api/usuarios/**
spring.cloud.gateway.server.webflux.routes[2].id=auditoria-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auditoria-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auditoria,/api/auditoria/**
spring.cloud.gateway.server.webflux.routes[3].id=compromisos-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://compromisos-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/compromisos,/api/compromisos/**
spring.cloud.gateway.server.webflux.routes[4].id=empresas-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://empresas-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/empresas,/api/empresas/**
spring.cloud.gateway.server.webflux.routes[5].id=pagos-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://pagos-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/pagos,/api/pagos/**
spring.cloud.gateway.server.webflux.routes[6].id=recomendaciones-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://recomendaciones-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/recomendaciones,/api/recomendaciones/**
spring.cloud.gateway.server.webflux.routes[7].id=reportes-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://reportes-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/reportes,/api/reportes/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=never
